<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Model Tester</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: #00d4ff;
      margin-bottom: 30px;
      font-size: 24px;
      border: 2px solid #00d4ff;
      padding: 15px;
      border-radius: 8px;
    }
    .api-key {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .api-key label {
      display: block;
      color: #00d4ff;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .api-key input {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    .api-key input:focus {
      outline: none;
      border-color: #00d4ff;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      flex: 1;
      padding: 12px 24px;
      background: #00d4ff;
      color: #0a0a0a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover { background: #00b8e6; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      transform: none;
    }
    .progress {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      margin: 10px 0 20px 0;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: #00d4ff;
      transition: width 0.3s;
    }
    .results {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      min-height: 400px;
    }
    .category {
      margin-bottom: 30px;
    }
    .category-title {
      color: #00d4ff;
      font-size: 18px;
      margin: 20px 0 10px 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #333;
    }
    .model-test {
      padding: 10px;
      margin: 5px 0;
      background: #0a0a0a;
      border-radius: 4px;
      border-left: 3px solid #333;
    }
    .model-test.testing { border-left-color: #ffaa00; }
    .model-test.success { border-left-color: #00ff88; }
    .model-test.failed { border-left-color: #ff4444; }
    .model-name { font-weight: bold; }
    .model-id { font-size: 11px; color: #666; margin-top: 2px; }
    .model-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      margin-left: 10px;
    }
    .status-testing { background: #ffaa00; color: #0a0a0a; }
    .status-success { background: #00ff88; color: #0a0a0a; }
    .status-failed { background: #ff4444; color: #fff; }
    .model-details {
      margin-top: 5px;
      font-size: 12px;
      color: #999;
    }
    .summary {
      margin-top: 20px;
      padding: 15px;
      background: #0a0a0a;
      border-radius: 4px;
      border: 1px solid #00d4ff;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }
    .info {
      text-align: center;
      color: #666;
      padding: 50px 0;
    }
    .info a {
      color: #00d4ff;
      text-decoration: none;
    }
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 OPENROUTER MODEL TESTER</h1>
    
    <div class="api-key">
      <label>OpenRouter API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your OpenRouter API key (sk-or-v1-...)">
      <div style="margin-top: 10px; font-size: 12px; color: #666;">
        Get your free API key from: <a href="https://openrouter.ai/keys" target="_blank" style="color: #00d4ff;">openrouter.ai/keys</a>
      </div>
    </div>

    <div class="controls">
      <button id="testBtn" onclick="runTests()">▶ Test All Models (18)</button>
      <button onclick="clearResults()">🗑 Clear Results</button>
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="results" id="results">
      <div class="info">
        Enter your OpenRouter API key above and click "Test All Models" to begin<br><br>
        This will test 18 recommended free models across different categories
      </div>
    </div>
  </div>

  <script>
    const OPENROUTER_MODELS = [
      // General Purpose
      { id: 'google/gemini-2.0-flash-exp:free', name: 'Gemini 2.0 Flash Exp', category: 'General', context: '1M' },
      { id: 'meta-llama/llama-3.1-405b-instruct:free', name: 'Llama 3.1 405B', category: 'General', context: '131K' },
      { id: 'meta-llama/llama-3.3-70b-instruct:free', name: 'Llama 3.3 70B', category: 'General', context: '131K' },
      { id: 'mistralai/mistral-small-3.1:free', name: 'Mistral Small 3.1', category: 'General', context: '128K' },
      { id: 'openai/gpt-oss-120b:free', name: 'GPT OSS 120B', category: 'General', context: '131K' },
      
      // Coding
      { id: 'qwen/qwen3-coder:free', name: 'Qwen3 Coder', category: 'Coding', context: '262K' },
      { id: 'mistralai/devstral-2:free', name: 'Devstral 2', category: 'Coding', context: '262K' },
      { id: 'xiaomi/mimo-v2-flash:free', name: 'MiMo-V2-Flash', category: 'Coding', context: '262K' },
      
      // Reasoning
      { id: 'deepseek/deepseek-r1:free', name: 'DeepSeek R1', category: 'Reasoning', context: '164K' },
      { id: 'arcee-ai/arcee-trinity-large:free', name: 'Arcee Trinity Large', category: 'Reasoning', context: '131K' },
      
      // Multimodal
      { id: 'google/gemma-3-27b:free', name: 'Gemma 3 27B', category: 'Multimodal', context: '131K' },
      { id: 'qwen/qwen-2.5-vl-7b:free', name: 'Qwen 2.5 VL 7B', category: 'Multimodal', context: '33K' },
      
      // Agents
      { id: 'nvidia/nemotron-3-nano:free', name: 'Nemotron 3 Nano', category: 'Agents', context: '256K' },
      { id: 'nous-research/hermes-3-405b:free', name: 'Hermes 3 405B', category: 'Agents', context: '131K' },
      
      // Additional
      { id: 'zhipu/glm-4.5-air:free', name: 'GLM-4.5-Air', category: 'Additional', context: '131K' },
      { id: 'upstage/solar-pro-3:free', name: 'Solar Pro 3', category: 'Additional', context: '128K' },
      { id: 'stepfun/step-3.5-flash:free', name: 'Step 3.5 Flash', category: 'Additional', context: '256K' },
      { id: 'google/gemma-3-12b:free', name: 'Gemma 3 12B', category: 'Additional', context: '33K' }
    ];

    const TEST_PROMPT = 'Say "OK" if you can read this.';

    async function testModel(model, apiKey) {
      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'HTTP-Referer': window.location.origin,
            'X-Title': 'ConstructLM Test',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model.id,
            messages: [{ role: 'user', content: TEST_PROMPT }],
            max_tokens: 20,
            temperature: 0
          })
        });

        if (!response.ok) {
          const error = await response.text();
          return { success: false, error: `HTTP ${response.status}` };
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '';
        
        return { 
          success: true, 
          reply: reply.trim(),
          tokens: data.usage?.total_tokens
        };
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    function updateProgress(current, total) {
      const percent = (current / total) * 100;
      document.getElementById('progressBar').style.width = percent + '%';
    }

    async function runTests() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const resultsDiv = document.getElementById('results');
      const testBtn = document.getElementById('testBtn');
      const progressDiv = document.getElementById('progress');

      if (!apiKey) {
        alert('Please enter your OpenRouter API key');
        return;
      }

      testBtn.disabled = true;
      progressDiv.style.display = 'block';
      resultsDiv.innerHTML = '';

      const results = {};
      const categories = [...new Set(OPENROUTER_MODELS.map(m => m.category))];
      
      categories.forEach(cat => {
        results[cat] = { tested: 0, passed: 0, failed: 0 };
      });

      let totalTests = OPENROUTER_MODELS.length;
      let completedTests = 0;

      for (const category of categories) {
        const categoryModels = OPENROUTER_MODELS.filter(m => m.category === category);
        
        const categorySection = document.createElement('div');
        categorySection.className = 'category';
        categorySection.innerHTML = `<div class="category-title">${category.toUpperCase()} (${categoryModels.length} models)</div>`;
        resultsDiv.appendChild(categorySection);

        for (const model of categoryModels) {
          const modelDiv = document.createElement('div');
          modelDiv.className = 'model-test testing';
          modelDiv.innerHTML = `
            <div class="model-name">${model.name} <span class="model-status status-testing">TESTING...</span></div>
            <div class="model-id">${model.id}</div>
            <div class="model-details">Context: ${model.context}</div>
          `;
          categorySection.appendChild(modelDiv);
          results[category].tested++;

          const result = await testModel(model, apiKey);
          completedTests++;
          updateProgress(completedTests, totalTests);

          if (result.success) {
            modelDiv.className = 'model-test success';
            modelDiv.innerHTML = `
              <div class="model-name">${model.name} <span class="model-status status-success">✓ AVAILABLE</span></div>
              <div class="model-id">${model.id}</div>
              <div class="model-details">Context: ${model.context} | Response: "${result.reply}" | Tokens: ${result.tokens || 'N/A'}</div>
            `;
            results[category].passed++;
          } else {
            modelDiv.className = 'model-test failed';
            modelDiv.innerHTML = `
              <div class="model-name">${model.name} <span class="model-status status-failed">✗ FAILED</span></div>
              <div class="model-id">${model.id}</div>
              <div class="model-details">Context: ${model.context} | Error: ${result.error}</div>
            `;
            results[category].failed++;
          }

          await new Promise(resolve => setTimeout(resolve, 500));
        }
      }

      // Summary
      const totalTested = Object.values(results).reduce((sum, r) => sum + r.tested, 0);
      const totalPassed = Object.values(results).reduce((sum, r) => sum + r.passed, 0);
      const totalFailed = Object.values(results).reduce((sum, r) => sum + r.failed, 0);
      const successRate = totalTested > 0 ? ((totalPassed / totalTested) * 100).toFixed(1) : 0;

      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'summary';
      let summaryHTML = '<div class="category-title">📊 TEST SUMMARY</div>';
      
      for (const [category, stats] of Object.entries(results)) {
        const catRate = stats.tested > 0 ? ((stats.passed / stats.tested) * 100).toFixed(1) : 0;
        summaryHTML += `
          <div class="summary-row">
            <span>${category}:</span>
            <span style="color: ${stats.passed === stats.tested ? '#00ff88' : '#ffaa00'}">
              ${stats.passed}/${stats.tested} (${catRate}%)
            </span>
          </div>
        `;
      }
      
      summaryHTML += `
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #333;">
          <div class="summary-row"><strong>Total Tested:</strong><strong>${totalTested}</strong></div>
          <div class="summary-row"><strong>Passed:</strong><strong style="color: #00ff88">${totalPassed}</strong></div>
          <div class="summary-row"><strong>Failed:</strong><strong style="color: #ff4444">${totalFailed}</strong></div>
          <div class="summary-row"><strong>Success Rate:</strong><strong style="color: ${successRate >= 80 ? '#00ff88' : '#ffaa00'}">${successRate}%</strong></div>
        </div>
      `;
      
      summaryDiv.innerHTML = summaryHTML;
      resultsDiv.appendChild(summaryDiv);

      testBtn.disabled = false;
      progressDiv.style.display = 'none';
    }

    function clearResults() {
      document.getElementById('results').innerHTML = `
        <div class="info">
          Enter your OpenRouter API key above and click "Test All Models" to begin<br><br>
          This will test 18 recommended free models across different categories
        </div>
      `;
      document.getElementById('progress').style.display = 'none';
    }
  </script>
</body>
</html>
