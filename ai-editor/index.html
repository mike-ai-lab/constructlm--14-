<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Editor - Inline Diff</title>
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: #252526;
      border-bottom: 1px solid #3e3e42;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }
    
    .header-actions {
      display: flex;
      gap: 8px;
    }
    
    .header-btn {
      padding: 6px 12px;
      background: #3e3e42;
      color: #e0e0e0;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .header-btn:hover {
      background: #4e4e52;
    }
    
    .status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1e1e1e;
      color: #858585;
    }
    
    .status.ready {
      color: #4ec9b0;
    }
    
    .status.editing {
      color: #569cd6;
      animation: pulse 1s infinite;
    }
    
    .status.reviewing {
      color: #f48771;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .container {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }
    
    .explorer {
      flex: 0 0 200px;
      background: #252526;
      border-right: 1px solid #3e3e42;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .explorer-title {
      padding: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #858585;
      border-bottom: 1px solid #3e3e42;
    }
    
    .explorer-files {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .file-item {
      padding: 8px 12px;
      margin: 2px 0;
      background: #1e1e1e;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    
    .file-item:hover {
      background: #2d2d30;
    }
    
    .file-item.active {
      background: #0e639c;
      color: white;
    }
    
    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .file-close {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .file-item:hover .file-close {
      opacity: 1;
    }
    
    .file-close:hover {
      color: #f48771;
    }
    
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #252526;
      overflow: hidden;
      position: relative;
    }
    
    #editor, #diffEditor {
      flex: 1;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 40px;
    }
    
    #diffEditor {
      display: none;
    }
    
    #diffEditor.show {
      display: block;
    }
    
    #editor.hide {
      display: none;
    }
    
    .editor-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e1e1e;
      border-top: 1px solid #3e3e42;
      padding: 8px 12px;
      font-size: 11px;
      color: #858585;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    
    .diff-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: none;
      gap: 8px;
      z-index: 100;
      animation: slideIn 0.3s ease-out;
    }
    
    .diff-actions.show {
      display: flex;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .diff-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    
    .diff-btn-accept {
      background: #4ec9b0;
      color: #000;
    }
    
    .diff-btn-accept:hover {
      background: #5ed9c0;
      transform: translateY(-1px);
    }
    
    .diff-btn-reject {
      background: #f48771;
      color: #000;
    }
    
    .diff-btn-reject:hover {
      background: #ff9781;
      transform: translateY(-1px);
    }
    
    .chat-section {
      flex: 0 0 350px;
      background: #252526;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #3e3e42;
      overflow: hidden;
    }
    
    .chat-title {
      padding: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #858585;
      border-bottom: 1px solid #3e3e42;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .message {
      display: flex;
      gap: 8px;
      animation: messageSlide 0.3s ease-out;
    }
    
    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.user {
      justify-content: flex-end;
    }
    
    .message.ai {
      justify-content: flex-start;
    }
    
    .message-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    
    .message.user .message-bubble {
      background: #0e639c;
      color: white;
    }
    
    .message.ai .message-bubble {
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #3e3e42;
    }
    
    .message.ai.success .message-bubble {
      border-color: #4ec9b0;
      background: rgba(78, 201, 176, 0.1);
    }
    
    .message.ai.error .message-bubble {
      border-color: #f48771;
      background: rgba(244, 135, 113, 0.1);
    }
    
    .message.ai.loading .message-bubble {
      border-color: #569cd6;
      background: rgba(86, 156, 214, 0.1);
    }
    
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    
    .typing-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #569cd6;
      animation: typing 1.4s infinite;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }
    
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #3e3e42;
      display: flex;
      gap: 8px;
    }
    
    .chat-input {
      flex: 1;
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 80px;
    }
    
    .chat-input:focus {
      border-color: #0e639c;
    }
    
    .chat-input::placeholder {
      color: #6a6a6a;
    }
    
    .send-btn {
      padding: 8px 12px;
      background: #0e639c;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }
    
    .send-btn:hover {
      background: #1177bb;
    }
    
    .send-btn:active {
      background: #0d5a8f;
    }
    
    .send-btn:disabled {
      background: #3e3e42;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #3e3e42;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #4e4e52;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>🤖 AI Code Editor</h1>
  <div class="header-actions">
    <button class="header-btn" onclick="newFile()">+ New File</button>
    <button class="header-btn" onclick="copyCode()">📋 Copy</button>
  </div>
  <div class="status ready" id="status">Ready</div>
</div>

<div class="container">
  <div class="explorer">
    <div class="explorer-title">Files</div>
    <div class="explorer-files" id="explorerFiles"></div>
  </div>
  
  <div class="editor-section">
    <div class="editor-container">
      <div id="editor"></div>
      <div id="diffEditor"></div>
      
      <div class="diff-actions" id="diffActions">
        <button class="diff-btn diff-btn-accept" onclick="acceptChanges()">✓ Accept</button>
        <button class="diff-btn diff-btn-reject" onclick="rejectChanges()">✗ Reject</button>
      </div>
      
      <div class="editor-footer">
        <span id="lineInfo">Line 1, Col 1</span>
        <span id="langInfo">JavaScript</span>
      </div>
    </div>
  </div>

  <div class="chat-section">
    <div class="chat-title">Chat with AI</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" placeholder="Describe your change..." rows="2"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>

let editor
let diffEditor
let isEditing = false
let pendingCode = null
let originalCode = null
let files = {}
let currentFile = 'index.js'

require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' }})

require(['vs/editor/editor.main'], function(){
  // Main editor
  editor = monaco.editor.create(document.getElementById('editor'), {
    value: `function hello() {
  console.log("hello")
}`,
    language: 'javascript',
    theme: 'vs-dark',
    minimap: { enabled: false },
    fontSize: 13,
    fontFamily: "'Monaco', 'Menlo', monospace"
  })

  // Diff editor
  diffEditor = monaco.editor.createDiffEditor(document.getElementById('diffEditor'), {
    theme: 'vs-dark',
    minimap: { enabled: false },
    fontSize: 13,
    fontFamily: "'Monaco', 'Menlo', monospace",
    renderSideBySide: false,
    readOnly: true
  })

  editor.onDidChangeCursorPosition(e => {
    const pos = e.position
    document.getElementById('lineInfo').textContent = `Line ${pos.lineNumber}, Col ${pos.column}`
  })
})

function addChatMessage(text, type = 'ai', isLoading = false) {
  const messagesDiv = document.getElementById('chatMessages')
  const messageDiv = document.createElement('div')
  messageDiv.className = `message ${type} ${isLoading ? 'loading' : ''}`
  
  const bubble = document.createElement('div')
  bubble.className = 'message-bubble'
  
  if (isLoading) {
    bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>'
  } else {
    bubble.textContent = text
  }
  
  messageDiv.appendChild(bubble)
  messagesDiv.appendChild(messageDiv)
  messagesDiv.scrollTop = messagesDiv.scrollHeight
  
  return messageDiv
}

function updateChatMessage(messageDiv, text, type = 'success') {
  messageDiv.className = `message ai ${type}`
  const bubble = messageDiv.querySelector('.message-bubble')
  bubble.textContent = text
}

function showDiff(oldCode, newCode, isSelection = false, startLine = 0, endLine = 0) {
  originalCode = oldCode
  pendingCode = { 
    code: newCode,
    isSelection,
    startLine,
    endLine
  }
  
  const originalModel = monaco.editor.createModel(oldCode, 'javascript')
  const modifiedModel = monaco.editor.createModel(newCode, 'javascript')
  
  diffEditor.setModel({
    original: originalModel,
    modified: modifiedModel
  })
  
  // Force layout update
  setTimeout(() => {
    diffEditor.layout()
  }, 100)
  
  document.getElementById('editor').classList.add('hide')
  document.getElementById('diffEditor').classList.add('show')
  document.getElementById('diffActions').classList.add('show')
  document.getElementById('status').textContent = 'Reviewing Changes'
  document.getElementById('status').className = 'status reviewing'
}

function acceptChanges() {
  if (pendingCode) {
    // If it was a selection edit, merge back into full file
    if (pendingCode.isSelection) {
      const fullCode = editor.getValue()
      const lines = fullCode.split('\n')
      const newLines = pendingCode.code.split('\n')
      
      // Replace only the selected lines
      lines.splice(pendingCode.startLine - 1, pendingCode.endLine - pendingCode.startLine + 1, ...newLines)
      editor.setValue(lines.join('\n'))
    } else {
      editor.setValue(pendingCode.code)
    }
    hideDiff()
    addChatMessage('✓ Changes applied', 'ai')
  }
}

function rejectChanges() {
  hideDiff()
  addChatMessage('✗ Changes rejected', 'ai')
}

function hideDiff() {
  document.getElementById('editor').classList.remove('hide')
  document.getElementById('diffEditor').classList.remove('show')
  document.getElementById('diffActions').classList.remove('show')
  document.getElementById('status').textContent = 'Ready'
  document.getElementById('status').className = 'status ready'
  pendingCode = null
  originalCode = null
}

async function sendMessage() {
  const input = document.getElementById('chatInput')
  const instruction = input.value.trim()
  
  if (!instruction) return
  
  saveCurrentFile()
  
  const sendBtn = document.getElementById('sendBtn')
  const status = document.getElementById('status')
  
  addChatMessage(instruction, 'user')
  input.value = ''
  
  const loadingMsg = addChatMessage('', 'ai', true)
  
  isEditing = true
  sendBtn.disabled = true
  status.textContent = 'Generating...'
  status.className = 'status editing'
  
  try {
    // Send ALL files as working set context
    const payload = {
      instruction,
      files: files,
      currentFile: currentFile
    }
    
    const res = await fetch('http://localhost:3000/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    
    if (!res.ok) {
      const error = await res.json()
      throw new Error(error.error || 'Request failed')
    }
    
    const data = await res.json()
    
    loadingMsg.remove()
    
    if (data.files) {
      // Multi-file response - update all files
      Object.entries(data.files).forEach(([filename, content]) => {
        files[filename] = content
      })
      
      updateExplorer()
      
      // Open first modified file
      const firstFile = Object.keys(data.files)[0]
      if (firstFile) {
        openFile(firstFile)
      }
      
      addChatMessage(`✓ Generated ${Object.keys(data.files).length} file(s)`, 'ai')
    } else if (data.code) {
      // Single file response (backward compat)
      files[currentFile] = data.code
      editor.setValue(data.code)
      addChatMessage('✓ Code generated', 'ai')
    } else {
      addChatMessage('No code generated', 'ai')
    }
  } catch (error) {
    updateChatMessage(loadingMsg, '✗ Error: ' + error.message, 'error')
    console.error(error)
  } finally {
    isEditing = false
    sendBtn.disabled = false
    status.textContent = 'Ready'
    status.className = 'status ready'
  }
}

function buildContext(code, position, selection) {
  const lines = code.split('\n')
  const totalLines = lines.length
  
  // Extract imports and exports (symbols)
  const symbols = extractSymbols(code)
  
  // If user has selection, use only that
  if (selection && !selection.isEmpty()) {
    const selectedCode = editor.getModel().getValueInRange(selection)
    return {
      mode: 'selection',
      selectedCode,
      symbols,
      startLine: selection.startLineNumber,
      endLine: selection.endLineNumber,
      totalLines
    }
  }
  
  // Otherwise use cursor window (100 lines above/below)
  const cursorLine = position.lineNumber
  const windowSize = 100
  const startLine = Math.max(1, cursorLine - windowSize)
  const endLine = Math.min(totalLines, cursorLine + windowSize)
  
  const contextLines = lines.slice(startLine - 1, endLine)
  const contextCode = contextLines.join('\n')
  
  return {
    mode: 'window',
    contextCode,
    symbols,
    cursorLine,
    startLine,
    endLine,
    totalLines
  }
}

function extractSymbols(code) {
  const symbols = {
    imports: [],
    exports: [],
    functions: [],
    classes: []
  }
  
  const lines = code.split('\n')
  
  lines.forEach(line => {
    const trimmed = line.trim()
    
    // Extract imports
    if (trimmed.startsWith('import ')) {
      symbols.imports.push(trimmed)
    }
    
    // Extract exports
    if (trimmed.startsWith('export ')) {
      const match = trimmed.match(/export (?:default |const |function |class )?(\w+)/)
      if (match) symbols.exports.push(match[1])
    }
    
    // Extract function names
    const funcMatch = trimmed.match(/(?:function|const|let|var)\s+(\w+)\s*[=\(]/)
    if (funcMatch) symbols.functions.push(funcMatch[1])
    
    // Extract class names
    const classMatch = trimmed.match(/class\s+(\w+)/)
    if (classMatch) symbols.classes.push(classMatch[1])
  })
  
  return symbols
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault()
    sendMessage()
  }
})

document.getElementById('sendBtn').addEventListener('click', sendMessage)

function newFile() {
  saveCurrentFile()
  const filename = prompt('Enter filename (e.g., index.js, style.css, index.html):')
  if (filename) {
    files[filename] = ''
    currentFile = filename
    editor.setValue('')
    const model = editor.getModel()
    const language = getLanguage(filename)
    monaco.editor.setModelLanguage(model, language)
    updateExplorer()
    addChatMessage(`Created ${filename}. Describe what you want!`, 'ai')
  }
}

function getLanguage(filename) {
  const ext = filename.split('.').pop()
  const langs = {
    'js': 'javascript',
    'jsx': 'javascript',
    'ts': 'typescript',
    'tsx': 'typescript',
    'html': 'html',
    'css': 'css',
    'json': 'json',
    'md': 'markdown'
  }
  return langs[ext] || 'plaintext'
}

function saveCurrentFile() {
  if (currentFile) {
    files[currentFile] = editor.getValue()
  }
}

function openFile(filename) {
  saveCurrentFile()
  currentFile = filename
  
  if (!files[filename]) {
    files[filename] = ''
  }
  
  editor.setValue(files[filename])
  
  // Set language correctly
  const model = editor.getModel()
  const language = getLanguage(filename)
  monaco.editor.setModelLanguage(model, language)
  
  document.querySelectorAll('.file-item').forEach(item => {
    item.classList.remove('active')
  })
  document.querySelector(`[data-file="${filename}"]`)?.classList.add('active')
}

function closeFile(filename, e) {
  e.stopPropagation()
  delete files[filename]
  
  if (currentFile === filename) {
    const remaining = Object.keys(files)
    currentFile = remaining.length > 0 ? remaining[0] : 'index.js'
    if (remaining.length > 0) {
      openFile(currentFile)
    } else {
      editor.setValue('')
    }
  }
  
  updateExplorer()
}

function updateExplorer() {
  const explorer = document.getElementById('explorerFiles')
  explorer.innerHTML = ''
  
  Object.keys(files).forEach(filename => {
    const item = document.createElement('div')
    item.className = `file-item ${filename === currentFile ? 'active' : ''}`
    item.setAttribute('data-file', filename)
    item.innerHTML = `
      <span class="file-name">${filename}</span>
      <span class="file-close" onclick="closeFile('${filename}', event)">×</span>
    `
    item.onclick = () => openFile(filename)
    explorer.appendChild(item)
  })
}

function copyCode() {
  const code = editor.getValue()
  navigator.clipboard.writeText(code).then(() => {
    addChatMessage('✓ Code copied to clipboard', 'ai')
  }).catch(() => {
    addChatMessage('✗ Failed to copy', 'ai')
  })
}

addChatMessage('Hi! You can edit existing code OR write new code from scratch. Just describe what you want!', 'ai')

</script>

</body>
</html>
