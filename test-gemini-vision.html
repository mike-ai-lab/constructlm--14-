<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vision Test</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border: 2px solid black;
            white-space: pre-wrap;
        }
        .success { color: green; }
        .error { color: red; }
        img {
            max-width: 400px;
            margin: 10px 0;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>Gemini Vision API Test</h1>
    
    <input type="text" id="apiKey" placeholder="Enter your Gemini API Key">
    <button onclick="listModels()">1. List Available Models</button>
    <div id="modelList" style="margin: 10px 0; padding: 10px; background: #e0e0e0; display: none;"></div>
    
    <input type="file" id="imageInput" accept="image/*">
    <img id="preview" style="display:none;">
    <button onclick="testGeminiVision()">2. Test Gemini Vision</button>
    
    <div id="result"></div>

    <script>
        // Preview image
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        async function listModels() {
            const apiKey = document.getElementById('apiKey').value;
            const modelListDiv = document.getElementById('modelList');
            const resultDiv = document.getElementById('result');
            
            if (!apiKey) {
                resultDiv.innerHTML = '<span class="error">ERROR: Please enter API key</span>';
                return;
            }
            
            resultDiv.innerHTML = 'Fetching available models...\n';
            
            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.innerHTML = '<span class="error">ERROR:\n' + JSON.stringify(error, null, 2) + '</span>';
                    return;
                }
                
                const data = await response.json();
                const allModels = data.models || [];
                
                modelListDiv.style.display = 'block';
                modelListDiv.innerHTML = '<strong>All Available Models:</strong><br>';
                allModels.forEach(m => {
                    const methods = m.supportedGenerationMethods?.join(', ') || 'none';
                    modelListDiv.innerHTML += `- ${m.name} (${methods})<br>`;
                });
                
                resultDiv.innerHTML = '<span class="success">Found ' + allModels.length + ' models total!\n\n';
                resultDiv.innerHTML += JSON.stringify(allModels, null, 2) + '</span>';
                
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">ERROR: ' + error.message + '</span>';
            }
        }

        async function testGeminiVision() {
            const apiKey = document.getElementById('apiKey').value;
            const imageInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            
            if (!apiKey) {
                resultDiv.innerHTML = '<span class="error">ERROR: Please enter API key</span>';
                return;
            }
            
            if (!imageInput.files[0]) {
                resultDiv.innerHTML = '<span class="error">ERROR: Please select an image</span>';
                return;
            }
            
            resultDiv.innerHTML = 'Testing Gemini Vision API...\n';
            
            try {
                // Convert image to base64
                const file = imageInput.files[0];
                const base64 = await fileToBase64(file);
                const base64Data = base64.split(',')[1]; // Remove data:image/...;base64, prefix
                
                resultDiv.innerHTML += 'Image converted to base64\n';
                resultDiv.innerHTML += `Image size: ${(base64Data.length / 1024).toFixed(2)} KB\n\n`;
                
                // Test Gemini Vision API
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    {
                                        text: "Analyze this image in detail. Describe what you see, identify any objects, text, or technical elements. If this is a construction-related image (blueprint, site photo, material), provide specific construction insights."
                                    },
                                    {
                                        inline_data: {
                                            mime_type: file.type,
                                            data: base64Data
                                        }
                                    }
                                ]
                            }]
                        })
                    }
                );
                
                resultDiv.innerHTML += `API Response Status: ${response.status}\n\n`;
                
                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.innerHTML += '<span class="error">ERROR:\n' + JSON.stringify(error, null, 2) + '</span>';
                    return;
                }
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const analysisText = data.candidates[0].content.parts[0].text;
                    resultDiv.innerHTML += '<span class="success">SUCCESS! Gemini Vision is working!\n\n';
                    resultDiv.innerHTML += '=== GEMINI ANALYSIS ===\n';
                    resultDiv.innerHTML += analysisText + '\n\n';
                    resultDiv.innerHTML += '=== RAW RESPONSE ===\n';
                    resultDiv.innerHTML += JSON.stringify(data, null, 2) + '</span>';
                } else {
                    resultDiv.innerHTML += '<span class="error">ERROR: Unexpected response format\n';
                    resultDiv.innerHTML += JSON.stringify(data, null, 2) + '</span>';
                }
                
            } catch (error) {
                resultDiv.innerHTML += '<span class="error">ERROR: ' + error.message + '\n';
                resultDiv.innerHTML += error.stack + '</span>';
            }
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
