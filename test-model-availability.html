<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Availability Tester</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: #00d4ff;
      margin-bottom: 30px;
      font-size: 24px;
      border: 2px solid #00d4ff;
      padding: 15px;
      border-radius: 8px;
    }
    .api-keys {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .key-input {
      margin-bottom: 15px;
    }
    .key-input label {
      display: block;
      color: #00d4ff;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .key-input input {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    .key-input input:focus {
      outline: none;
      border-color: #00d4ff;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      flex: 1;
      padding: 12px 24px;
      background: #00d4ff;
      color: #0a0a0a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover { background: #00b8e6; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      transform: none;
    }
    .results {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      min-height: 400px;
    }
    .section-title {
      color: #00d4ff;
      font-size: 18px;
      margin: 20px 0 10px 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #333;
    }
    .model-test {
      padding: 10px;
      margin: 5px 0;
      background: #0a0a0a;
      border-radius: 4px;
      border-left: 3px solid #333;
    }
    .model-test.testing { border-left-color: #ffaa00; }
    .model-test.success { border-left-color: #00ff88; }
    .model-test.failed { border-left-color: #ff4444; }
    .model-test.skipped { border-left-color: #666; }
    .model-name { font-weight: bold; }
    .model-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      margin-left: 10px;
    }
    .status-testing { background: #ffaa00; color: #0a0a0a; }
    .status-success { background: #00ff88; color: #0a0a0a; }
    .status-failed { background: #ff4444; color: #fff; }
    .status-skipped { background: #666; color: #fff; }
    .model-details {
      margin-top: 5px;
      font-size: 12px;
      color: #999;
    }
    .summary {
      margin-top: 20px;
      padding: 15px;
      background: #0a0a0a;
      border-radius: 4px;
      border: 1px solid #00d4ff;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }
    .progress {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-bar {
      height: 100%;
      background: #00d4ff;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 MODEL AVAILABILITY TESTER</h1>
    
    <div class="api-keys">
      <div class="key-input">
        <label>🔵 GROQ API KEY</label>
        <input type="password" id="groqKey" placeholder="Enter your Groq API key...">
      </div>
      <div class="key-input">
        <label>🟣 CEREBRAS API KEY</label>
        <input type="password" id="cerebrasKey" placeholder="Enter your Cerebras API key...">
      </div>
    </div>

    <div class="controls">
      <button id="testBtn" onclick="runTests()">▶ Run Tests</button>
      <button onclick="clearResults()">🗑 Clear Results</button>
    </div>

    <div class="progress" id="progress" style="display: none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="results" id="results">
      <div style="text-align: center; color: #666; padding: 50px 0;">
        Configure your API keys above and click "Run Tests" to begin
      </div>
    </div>
  </div>

  <script>
    const GROQ_MODELS = [
      { id: 'llama-3.3-70b-versatile', name: 'Llama 3.3 70B • Groq' },
      { id: 'llama-3.1-8b-instant', name: 'Llama 3.1 8B • Groq' },
      { id: 'qwen/qwen3-32b', name: 'Qwen 3 32B' },
      { id: 'meta-llama/llama-4-scout-17b-16e-instruct', name: 'Llama 4 Scout 17B' },
      { id: 'meta-llama/llama-4-maverick-17b-128e-instruct', name: 'Llama 4 Maverick 17B' },
      { id: 'openai/gpt-oss-120b', name: 'GPT OSS 120B' },
      { id: 'openai/gpt-oss-safeguard-20b', name: 'GPT OSS Safeguard 20B' },
      { id: 'openai/gpt-oss-20b', name: 'GPT OSS 20B' },
      { id: 'meta-llama/llama-guard-4-12b', name: 'Llama Guard 4 12B' },
      { id: 'meta-llama/llama-prompt-guard-2-86m', name: 'Llama Prompt Guard 86M' },
      { id: 'meta-llama/llama-prompt-guard-2-22m', name: 'Llama Prompt Guard 22M' }
    ];

    const CEREBRAS_MODELS = [
      { id: 'llama3.3-70b', name: 'Llama 3.3 70B • Cerebras' },
      { id: 'gpt-oss-120b', name: 'GPT OSS 120B • Cerebras' },
      { id: 'qwen-3-235b-a22b-instruct-2507', name: 'Qwen 3 235B • Cerebras' },
      { id: 'zai-glm-4.7', name: 'ZAI GLM 4.7 • Cerebras' }
    ];

    const TEST_PROMPT = 'Say "OK" if you can read this.';

    async function testGroqModel(model, apiKey) {
      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model.id,
            messages: [{ role: 'user', content: TEST_PROMPT }],
            max_tokens: 10,
            temperature: 0
          })
        });

        if (!response.ok) {
          const error = await response.text();
          return { success: false, error: `HTTP ${response.status}` };
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '';
        
        return { 
          success: true, 
          reply: reply.trim(),
          tokens: data.usage?.total_tokens
        };
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    async function testCerebrasModel(model, apiKey) {
      try {
        const response = await fetch('https://api.cerebras.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model.id,
            messages: [{ role: 'user', content: TEST_PROMPT }],
            max_tokens: 10,
            temperature: 0
          })
        });

        if (!response.ok) {
          const error = await response.text();
          return { success: false, error: `HTTP ${response.status}` };
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '';
        
        return { 
          success: true, 
          reply: reply.trim(),
          tokens: data.usage?.total_tokens
        };
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    function updateProgress(current, total) {
      const percent = (current / total) * 100;
      document.getElementById('progressBar').style.width = percent + '%';
    }

    async function runTests() {
      const groqKey = document.getElementById('groqKey').value.trim();
      const cerebrasKey = document.getElementById('cerebrasKey').value.trim();
      const resultsDiv = document.getElementById('results');
      const testBtn = document.getElementById('testBtn');
      const progressDiv = document.getElementById('progress');

      if (!groqKey && !cerebrasKey) {
        alert('Please enter at least one API key');
        return;
      }

      testBtn.disabled = true;
      progressDiv.style.display = 'block';
      resultsDiv.innerHTML = '';

      const results = {
        groq: { tested: 0, passed: 0, failed: 0, skipped: 0 },
        cerebras: { tested: 0, passed: 0, failed: 0, skipped: 0 }
      };

      let totalTests = 0;
      let completedTests = 0;

      if (groqKey) totalTests += GROQ_MODELS.length;
      if (cerebrasKey) totalTests += CEREBRAS_MODELS.length;

      // Test Groq Models
      if (groqKey) {
        const groqSection = document.createElement('div');
        groqSection.innerHTML = '<div class="section-title">🔵 GROQ MODELS</div>';
        resultsDiv.appendChild(groqSection);

        for (const model of GROQ_MODELS) {
          const modelDiv = document.createElement('div');
          modelDiv.className = 'model-test testing';
          modelDiv.innerHTML = `
            <div class="model-name">${model.name} <span class="model-status status-testing">TESTING...</span></div>
          `;
          resultsDiv.appendChild(modelDiv);
          results.groq.tested++;

          const result = await testGroqModel(model, groqKey);
          completedTests++;
          updateProgress(completedTests, totalTests);

          if (result.success) {
            modelDiv.className = 'model-test success';
            modelDiv.innerHTML = `
              <div class="model-name">${model.name} <span class="model-status status-success">✓ AVAILABLE</span></div>
              <div class="model-details">Response: "${result.reply}" | Tokens: ${result.tokens || 'N/A'}</div>
            `;
            results.groq.passed++;
          } else {
            modelDiv.className = 'model-test failed';
            modelDiv.innerHTML = `
              <div class="model-name">${model.name} <span class="model-status status-failed">✗ FAILED</span></div>
              <div class="model-details">Error: ${result.error}</div>
            `;
            results.groq.failed++;
          }

          await new Promise(resolve => setTimeout(resolve, 100));
        }
      } else {
        results.groq.skipped = GROQ_MODELS.length;
        const groqSection = document.createElement('div');
        groqSection.innerHTML = `
          <div class="section-title">🔵 GROQ MODELS</div>
          <div class="model-test skipped">
            <div class="model-name">All Groq models <span class="model-status status-skipped">⊘ SKIPPED</span></div>
            <div class="model-details">No API key provided</div>
          </div>
        `;
        resultsDiv.appendChild(groqSection);
      }

      // Test Cerebras Models
      if (cerebrasKey) {
        const cerebrasSection = document.createElement('div');
        cerebrasSection.innerHTML = '<div class="section-title">🟣 CEREBRAS MODELS</div>';
        resultsDiv.appendChild(cerebrasSection);

        for (const model of CEREBRAS_MODELS) {
          const modelDiv = document.createElement('div');
          modelDiv.className = 'model-test testing';
          modelDiv.innerHTML = `
            <div class="model-name">${model.name} <span class="model-status status-testing">TESTING...</span></div>
          `;
          resultsDiv.appendChild(modelDiv);
          results.cerebras.tested++;

          const result = await testCerebrasModel(model, cerebrasKey);
          completedTests++;
          updateProgress(completedTests, totalTests);

          if (result.success) {
            modelDiv.className = 'model-test success';
            modelDiv.innerHTML = `
              <div class="model-name">${model.name} <span class="model-status status-success">✓ AVAILABLE</span></div>
              <div class="model-details">Response: "${result.reply}" | Tokens: ${result.tokens || 'N/A'}</div>
            `;
            results.cerebras.passed++;
          } else {
            modelDiv.className = 'model-test failed';
            modelDiv.innerHTML = `
              <div class="model-name">${model.name} <span class="model-status status-failed">✗ FAILED</span></div>
              <div class="model-details">Error: ${result.error}</div>
            `;
            results.cerebras.failed++;
          }

          await new Promise(resolve => setTimeout(resolve, 100));
        }
      } else {
        results.cerebras.skipped = CEREBRAS_MODELS.length;
        const cerebrasSection = document.createElement('div');
        cerebrasSection.innerHTML = `
          <div class="section-title">🟣 CEREBRAS MODELS</div>
          <div class="model-test skipped">
            <div class="model-name">All Cerebras models <span class="model-status status-skipped">⊘ SKIPPED</span></div>
            <div class="model-details">No API key provided</div>
          </div>
        `;
        resultsDiv.appendChild(cerebrasSection);
      }

      // Summary
      const totalTested = results.groq.tested + results.cerebras.tested;
      const totalPassed = results.groq.passed + results.cerebras.passed;
      const totalFailed = results.groq.failed + results.cerebras.failed;
      const successRate = totalTested > 0 ? ((totalPassed / totalTested) * 100).toFixed(1) : 0;

      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'summary';
      summaryDiv.innerHTML = `
        <div class="section-title">📊 TEST SUMMARY</div>
        <div class="summary-row"><span>Groq Passed:</span><span style="color: #00ff88">${results.groq.passed}</span></div>
        <div class="summary-row"><span>Groq Failed:</span><span style="color: #ff4444">${results.groq.failed}</span></div>
        <div class="summary-row"><span>Cerebras Passed:</span><span style="color: #00ff88">${results.cerebras.passed}</span></div>
        <div class="summary-row"><span>Cerebras Failed:</span><span style="color: #ff4444">${results.cerebras.failed}</span></div>
        <div class="summary-row"><strong>Total Tested:</strong><strong>${totalTested}</strong></div>
        <div class="summary-row"><strong>Success Rate:</strong><strong style="color: ${successRate == 100 ? '#00ff88' : '#ffaa00'}">${successRate}%</strong></div>
      `;
      resultsDiv.appendChild(summaryDiv);

      testBtn.disabled = false;
      progressDiv.style.display = 'none';
    }

    function clearResults() {
      document.getElementById('results').innerHTML = `
        <div style="text-align: center; color: #666; padding: 50px 0;">
          Configure your API keys above and click "Run Tests" to begin
        </div>
      `;
      document.getElementById('progress').style.display = 'none';
    }
  </script>
</body>
</html>
