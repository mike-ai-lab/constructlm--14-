<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Fix Pro - Gemini Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        .editor-container {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 320px;
            gap: 1px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .pane {
            background-color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 8px 16px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
        }

        .line-numbers {
            color: #cbd5e1;
            text-align: right;
            padding-right: 12px;
            user-select: none;
            border-right: 1px solid #f1f5f9;
            font-size: 0.8rem;
        }

        textarea {
            resize: none;
            outline: none;
            border: none;
            width: 100%;
            height: 100%;
            padding: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #1e293b;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .ai-bubble {
            background-color: #f1f5f9;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-bubble {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg">
                <i class="fas fa-microchip"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800">AI Code Fix Pro <span class="text-blue-500 font-medium">— Gemini Style</span></h1>
        </div>
        
        <div class="flex items-center gap-3">
            <span class="flex items-center gap-2 text-xs font-semibold px-2.5 py-1 bg-green-100 text-green-700 rounded-full">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Ready
            </span>
            <button onclick="detectErrors()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                Detect Errors
            </button>
            <button id="aiFixBtn" disabled class="bg-slate-200 text-slate-400 px-4 py-2 rounded-md text-sm font-medium cursor-not-allowed transition-all">
                AI Fix
            </button>
            <button id="applyFixBtn" disabled class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium opacity-50 cursor-not-allowed">
                Apply Fix
            </button>
            <button class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-md text-sm font-medium">
                Hide Chat
            </button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="bg-white px-6 py-2 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                <input type="checkbox" checked class="w-4 h-4 text-blue-600 rounded">
                Auto-fix common issues
            </label>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="editor-container">
        
        <!-- Original Code Pane -->
        <section class="pane">
            <div class="pane-header">
                <span>ORIGINAL CODE</span>
                <button title="Copy" class="text-slate-400 hover:text-slate-600"><i class="far fa-copy"></i></button>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div class="line-numbers code-font pt-3 bg-slate-50 w-10">
                    1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15
                </div>
                <textarea id="originalCode" class="code-font" spellcheck="false">import React, { useState } from "react";

export default function LoginForm() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");

  return (
    <div className="container">
      <form>
        <input 
          type="email" 
          value={email}
          onChange={e => setEmail(e.target.value)}
        />
      </form>
    </div>
  );
}</textarea>
            </div>
        </section>

        <!-- Fixed Code Preview Pane -->
        <section class="pane border-l border-slate-200">
            <div class="pane-header">
                <span>FIXED CODE PREVIEW</span>
                <button title="Copy" class="text-slate-400 hover:text-slate-600"><i class="far fa-copy"></i></button>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div class="line-numbers code-font pt-3 bg-slate-50 w-10">1</div>
                <textarea id="fixedCode" class="code-font text-slate-400 bg-slate-50" readonly placeholder="Fixed code will appear here after detection..."></textarea>
            </div>
        </section>

        <!-- AI Assistant Sidebar -->
        <aside class="pane border-l border-slate-200">
            <div class="pane-header">
                <span>AI ASSISTANT</span>
                <button title="Clear Chat" class="text-slate-400 hover:text-slate-600"><i class="far fa-trash-alt"></i></button>
            </div>
            <div id="chatHistory" class="flex-1 p-4 overflow-y-auto flex flex-column flex-col">
                <div class="chat-bubble ai-bubble shadow-sm">
                    Hi Muhamad! I'm your AI code assistant. Paste your code in the left panel and click "Detect Errors" to get started.
                </div>
            </div>
            <div class="p-3 border-t border-slate-200 bg-slate-50">
                <div class="relative">
                    <input type="text" placeholder="Ask AI anything..." class="w-full pl-3 pr-10 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <button class="absolute right-2 top-1.5 text-blue-600"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </aside>
    </main>

    <!-- Footer Status Bar -->
    <footer class="bg-slate-800 text-slate-300 px-4 py-1.5 flex items-center justify-between text-xs font-medium">
        <div class="flex items-center gap-4">
            <span><i class="fas fa-terminal mr-2"></i> Debug Log & Workflow Trace</span>
            <span class="text-slate-500">|</span>
            <span class="text-green-400"><i class="fas fa-check-circle mr-1"></i> No syntax errors found</span>
        </div>
        <div class="flex items-center gap-3">
            <button class="hover:text-white flex items-center gap-1"><i class="far fa-copy"></i> Copy Log</button>
            <button class="hover:text-white flex items-center gap-1"><i class="fas fa-eraser"></i> Clear</button>
            <button class="hover:text-white flex items-center gap-1 bg-slate-700 px-2 py-0.5 rounded"><i class="fas fa-download"></i> Download</button>
        </div>
    </footer>

    <script>
        function addChatMessage(text, isAi = true) {
            const chatHistory = document.getElementById('chatHistory');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${isAi ? 'ai-bubble' : 'user-bubble'} shadow-sm`;
            bubble.textContent = text;
            chatHistory.appendChild(bubble);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function detectErrors() {
            const btn = document.querySelector('button[onclick="detectErrors()"]');
            btn.innerHTML = '<i class="fas fa-spinner animate-spin mr-2"></i> Analyzing...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = 'Detect Errors';
                btn.disabled = false;
                
                addChatMessage("Muhamad, I've scanned your code. I found missing accessible labels and suggested some performance optimizations for the hooks.");
                
                const aiFixBtn = document.getElementById('aiFixBtn');
                aiFixBtn.disabled = false;
                aiFixBtn.classList.remove('bg-slate-200', 'text-slate-400');
                aiFixBtn.classList.add('bg-blue-100', 'text-blue-700', 'hover:bg-blue-200');
                
                // Enable AI Fix click
                aiFixBtn.onclick = runAiFix;
            }, 1500);
        }

        function runAiFix() {
            const aiFixBtn = document.getElementById('aiFixBtn');
            const fixedTextarea = document.getElementById('fixedCode');
            const applyFixBtn = document.getElementById('applyFixBtn');
            
            aiFixBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles animate-pulse mr-2"></i> Fixing...';
            
            setTimeout(() => {
                const fixedCode = `import React, { useState, useCallback } from "react";

export default function LoginForm() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");

  const handleEmailChange = useCallback((e) => {
    setEmail(e.target.value);
  }, []);

  return (
    <div className="container p-4 max-w-md mx-auto">
      <h2 class="text-xl font-bold mb-4">Login</h2>
      <form className="space-y-4">
        <div>
          <label htmlFor="email" className="block text-sm font-medium">Email Address</label>
          <input 
            id="email"
            type="email" 
            className="w-full border rounded p-2"
            value={email}
            onChange={handleEmailChange}
            required
          />
        </div>
      </form>
    </div>
  );
}`;
                fixedTextarea.value = fixedCode;
                fixedTextarea.classList.remove('text-slate-400', 'bg-slate-50');
                fixedTextarea.classList.add('text-slate-800', 'bg-white');
                
                aiFixBtn.innerHTML = 'AI Fix Applied';
                aiFixBtn.disabled = true;
                
                applyFixBtn.disabled = false;
                applyFixBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                
                addChatMessage("I've generated the improved code. I added useCallback for performance and proper accessibility labels.");
            }, 1000);
        }

        // Handle Apply Fix
        document.getElementById('applyFixBtn').onclick = function() {
            document.getElementById('originalCode').value = document.getElementById('fixedCode').value;
            this.innerHTML = '<i class="fas fa-check mr-2"></i> Applied';
            this.disabled = true;
            addChatMessage("Code successfully updated!");
        };
    </script>
</body>
</html>
