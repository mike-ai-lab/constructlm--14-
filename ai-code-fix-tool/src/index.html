<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Code Fix Tool | Professional Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Required Libraries for App Integration -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Monaco Editor -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs/editor/editor.main.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs/loader.min.js"></script>
    
    <!-- External Styles -->
    <link rel="stylesheet" href="styles/main.css">
    
    <style>
        /* CSS Variables for Theme System */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f8f8;
            --bg-tertiary: #f1f1f1;
            --text-primary: #121212;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --accent-bg: #121212;
            --accent-text: #ffffff;
            --input-bg: #ffffff;
            --console-bg: #1a1a1a;
            --console-header: #262626;
            --console-text: #d4d4d8;
            --selection: #e2e2e2;
            --transition-speed: 0.4s;
            --error-color: #dc3545;
            --success-color: #28a745;
            --processing-color: #ffc107;
            --diff-add: #d4edda;
            --diff-remove: #f8d7da;
        }

        .dark-theme {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-tertiary: #161616;
            --text-primary: #f0f0f0;
            --text-secondary: #999999;
            --border-color: #222222;
            --accent-bg: #1e1e1e;
            --accent-text: #f0f0f0;
            --input-bg: #000000;
            --console-bg: #000000;
            --console-header: #111111;
            --console-text: #a1a1aa;
            --selection: #333333;
        }

        /* Chat specific styles that need to be inline */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: var(--bg-primary);
        }

        .message {
            max-width: 90%;
            padding: 0.85rem 1rem;
            font-size: 13px;
            line-height: 1.55;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
        }

        .message-user {
            align-self: flex-end;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-right-radius: 4px;
        }

        .message-bot {
            align-self: flex-start;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message.no-style {
            background: transparent;
            border: none;
            padding: 0;
            max-width: 100%;
            box-shadow: none;
        }

        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end;
        }

        .message-input {
            width: 100%;
            min-height: 42px;
            max-height: 120px;
            padding: 0.75rem 3rem 0.75rem 1rem;
            font-size: 13px;
            line-height: 1.5;
            font-family: 'Inter', sans-serif;
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: var(--text-secondary);
        }

        .message-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .send-btn {
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-bg);
            color: var(--accent-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="dark-theme" id="app">

    <div class="overlay" id="overlay"></div>

    <header class="app-header">
        <div class="header-left">
            <button class="mobile-toggle btn-icon-alt" id="menuBtn">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i>
                </div>
                <div class="logo-text">
                    <h1 class="app-title">AI Code Fix Pro</h1>
                    <span class="app-version">v3.0</span>
                </div>
            </div>
            
            <div class="header-status-group">
                <div id="provider-badge-container" class="provider-pill" title="Current AI Provider and Model">
                    <span class="provider-dot"></span>
                    <span id="provider-badge" class="provider-name">Groq</span>
                </div>
                <span id="status-badge" class="status-pill success">Ready</span>
            </div>
        </div>

        <div class="header-center">
            <div class="tab-switcher">
                <button id="editorTab" class="tab-btn active">
                    <i data-lucide="code-2" class="w-3.5 h-3.5 mr-1.5"></i>
                    Editor
                </button>
                <button id="previewTab" class="tab-btn">
                    <i data-lucide="play" class="w-3.5 h-3.5 mr-1.5"></i>
                    Preview
                </button>
            </div>
        </div>

        <div class="header-right">
            <div class="vertical-divider hidden md:block"></div>



            <div class="vertical-divider"></div>

            <div class="util-group">
                <button id="settings-btn" class="btn-icon-alt" title="AI Settings">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
                <button id="toggle-chat" class="btn-icon-alt hidden lg:flex" title="Toggle Chat">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                </button>
                <button class="btn-icon-alt" id="themeToggle" title="Toggle Theme">
                    <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <main class="editor-section">
            <div class="editor-toolbar">
                <div class="toolbar-group">
                    <button class="btn-icon" id="undo-btn" disabled title="Undo (Ctrl+Z)">
                        <i data-lucide="undo" class="w-4 h-4"></i>
                    </button>
                    <button class="btn-icon" id="redo-btn" disabled title="Redo (Ctrl+Y)">
                        <i data-lucide="redo" class="w-4 h-4"></i>
                    </button>
                    <span id="history-info" class="text-[10px] opacity-40 ml-1 font-mono uppercase tracking-tighter">No history</span>
                    
                    <div class="toolbar-divider"></div>
                    
                    <button class="btn-icon" id="copy-code-btn" title="Copy Code">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                    <button class="btn-icon" id="clear-code-btn" title="Clear Code">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="toolbar-group">
                    <!-- Diff Batch Actions (hidden by default) -->
                    <div id="diff-batch-actions" style="display: none;" class="flex items-center gap-2 mr-2 pr-2 border-r border-zinc-700">
                        <span class="text-xs opacity-60" id="diff-count">0 changes</span>
                        <button class="action-btn bg-green-600 text-white" id="accept-all-btn" title="Accept all changes">
                            <i data-lucide="check-circle" class="w-3 h-3 inline mr-1"></i>
                            Accept All
                        </button>
                        <button class="action-btn bg-red-600 text-white" id="reject-all-btn" title="Reject all changes">
                            <i data-lucide="x-circle" class="w-3 h-3 inline mr-1"></i>
                            Reject All
                        </button>
                        <div class="toolbar-divider"></div>
                    </div>

                    <div class="toggle-group">
                        <label class="mini-toggle" title="Automatically accept AI fixes">
                            <input type="checkbox" id="auto-accept-toggle" checked>
                            <span>Auto-Accept</span>
                        </label>
                        
                        <div class="toolbar-divider"></div>
                        
                        <label class="mini-toggle" title="Update preview as you type">
                            <input type="checkbox" id="auto-run-toggle" checked>
                            <span>Auto-Run</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Monaco Editor Container -->
            <div class="code-viewport" id="codeViewport">
                <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
            </div>

            <iframe id="preview-iframe"></iframe>

            <div id="consolePanel" class="console-panel">
                <div id="consoleHeader" class="console-header">
                    <div class="flex items-center gap-2">
                        <i id="consoleChevron" data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                        <div class="flex items-center gap-3">
                            <button id="problems-tab" class="console-tab active">
                                Problems
                            </button>
                            <button id="debug-tab" class="console-tab">
                                Debug Logs
                            </button>
                        </div>
                        <button id="panel-fix-btn" class="action-btn bg-blue-600 hover:bg-blue-700 text-white ml-2 flex items-center gap-1.5 px-3 py-1 text-[10px]" style="display: none;">
                            <i data-lucide="sparkles" class="w-3 h-3"></i>
                            Fix with AI
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <button class="btn-icon h-6 w-6" id="copy-debug-btn" title="Copy debug logs" style="display: none;">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                        </button>
                        <button class="btn-icon h-6 w-6" id="clear-console-btn" title="Clear">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
                <div class="console-body" id="console-log">
                    <div style="opacity: 0.6; color: #9ca3af;">[✓] No problems found</div>
                </div>
                <div class="console-body" id="debug-log" style="display: none;">
                    <div style="opacity: 0.6; color: #9ca3af;">No debug logs yet</div>
                </div>
            </div>
        </main>

        <aside class="ai-sidebar collapsed" id="chat-panel">
            <div class="px-3 border-b flex items-center justify-between" style="border-color: var(--border-color); height: 40px;">
                <h2 class="text-sm font-bold flex items-center gap-2">AI Assistant</h2>
                <div class="flex gap-2">
                    <button class="btn-icon h-7 w-7" id="clear-chat-btn" title="Clear chat">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="mobile-toggle btn-icon h-7 w-7" id="closeSidebarBtn">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <div class="chat-container" id="chat-messages">
                <div class="message message-bot">
                    Hello Muhamad. I'm your AI assistant. I can help you fix code errors, explain concepts, and improve your code quality. How can I help you today?
                </div>
            </div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea class="message-input" id="chatInput" placeholder="Ask AI to fix, explain or improve..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- DEBUG WINDOW COMMENTED OUT - Not functional
    <div id="debug-window" class="debug-window">
        <div class="debug-window-header">
            <h3>Debug Log</h3>
            <div class="debug-window-controls">
                <button id="copy-debug-btn" class="action-btn">Copy</button>
                <button id="clear-debug-btn" class="action-btn">Clear</button>
                <button id="close-debug-btn" class="action-btn">X</button>
            </div>
        </div>
        <div id="debug-log" class="debug-window-content"></div>
    </div>
    -->

    <!-- App Module - Real functionality -->
    <script type="module" src="js/app.js"></script>
    
    <!-- Global error handler for Monaco Editor -->
    <script>
        // Suppress Monaco's getModifierState error
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('getModifierState')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
    </script>
    
    <!-- Initialize Lucide Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
