<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Code Fix Tool | Professional Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Required Libraries for App Integration -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    
    <!-- Monaco Editor -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    
    <style>
        /* SMOOTH THEME ENGINE */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f8f8;
            --bg-tertiary: #f1f1f1;
            --text-primary: #121212;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --accent-bg: #121212;
            --accent-text: #ffffff;
            --input-bg: #ffffff;
            --console-bg: #1a1a1a;
            --console-header: #262626;
            --console-text: #d4d4d8;
            --selection: #e2e2e2;
            --transition-speed: 0.4s;
            
            /* App-specific colors */
            --error-color: #dc3545;
            --success-color: #28a745;
            --processing-color: #ffc107;
            --diff-add: #d4edda;
            --diff-remove: #f8d7da;
        }

        .dark-theme {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #999999;
            --border-color: #222222;
            --accent-bg: #f0f0f0;
            --accent-text: #0a0a0a;
            --input-bg: #000000;
            --console-bg: #000000;
            --console-header: #111111;
            --console-text: #a1a1aa;
            --selection: #333333;
        }

        /* Smooth transitions */
        * {
            transition: background-color var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1), 
                        color var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            height: 45px;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            z-index: 50;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background-color: var(--bg-primary);
        }

        /* SIDEBAR */
        .ai-sidebar {
            width: 340px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            z-index: 40;
            transition: width 0.3s ease, transform 0.3s ease;
        }
        
        /* Desktop collapse */
        .ai-sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .ai-sidebar {
                position: absolute; right: 0; top: 0; bottom: 0;
                width: 85%; max-width: 360px;
                transform: translateX(100%);
                box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            }
            .ai-sidebar.active { transform: translateX(0); }
            .ai-sidebar.collapsed { width: 85%; max-width: 360px; } /* Override desktop collapse on mobile */
            .overlay {
                display: none; position: fixed; inset: 0;
                background: rgba(0,0,0,0.5); z-index: 35;
            }
            .overlay.active { display: block; }
        }

        /* EDITOR UI */
        .editor-toolbar {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        /* MONACO EDITOR CONTAINER */
        .code-viewport {
            flex: 1;
            display: flex;
            position: relative;
            background-color: var(--bg-primary);
            overflow: hidden; /* Monaco handles its own scrolling */
        }

        #monaco-editor {
            width: 100%;
            height: 100%;
        }

        /* Monaco line numbers styling - override Monaco's defaults */
        .monaco-editor .margin {
            background-color: var(--bg-secondary) !important;
        }

        .monaco-editor .line-numbers {
            color: var(--text-secondary) !important;
        }

        /* PREVIEW RENDERER */
        #previewContainer {
            display: none;
            flex: 1;
            background: white;
            border: none;
        }

        /* CONSOLE */
        .console-panel {
            height: 32px;
            background-color: var(--console-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .console-panel.expanded { height: 220px; }
        .console-header {
            height: 32px; min-height: 32px;
            background-color: var(--console-header);
            color: var(--console-text);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1rem; cursor: pointer; font-size: 10px; font-weight: 700;
        }
        .console-body {
            flex: 1; overflow-y: auto; padding: 0.75rem;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: var(--console-text); background-color: var(--console-bg);
        }

        /* CHAT */
        .chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1.25rem; 
            display: flex; 
            flex-direction: column; 
            gap: 1rem;
            background-color: var(--bg-secondary);
        }
        .message { 
            max-width: 85%; 
            padding: 0.85rem 1rem; 
            font-size: 13px; 
            line-height: 1.6; 
            border-radius: 12px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .message-user { 
            align-self: flex-end; 
            background-color: var(--bg-tertiary); 
            color: var(--text-primary); 
            border-bottom-right-radius: 2px; 
            border: 1px solid var(--border-color);
        }
        .message-bot { 
            align-self: flex-start; 
            background-color: var(--accent-bg); 
            color: var(--accent-text); 
            border-bottom-left-radius: 2px;
        }
        
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end;
        }
        
        .message-input {
            width: 100%;
            min-height: 42px;
            max-height: 120px;
            padding: 0.75rem 3rem 0.75rem 1rem;
            font-size: 13px;
            line-height: 1.5;
            font-family: 'Inter', sans-serif;
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .message-input:focus {
            border-color: var(--text-secondary);
        }
        
        .message-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        
        .send-btn {
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-bg);
            color: var(--accent-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .send-btn:hover {
            opacity: 0.9;
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }
        
        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* STATUS BADGE */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-badge.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-badge.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-badge.processing {
            background: #fff3cd;
            color: #856404;
        }
        
        /* INLINE DIFF DECORATIONS (GitHub Style - matching mockup.tsx) */
        .diff-line-removed {
            background: #442326 !important; /* Dark red like GitHub */
        }
        
        .diff-line-added {
            background: #234431 !important; /* Dark green like GitHub */
        }
        
        .dark-theme .diff-line-removed {
            background: #442326 !important;
        }
        
        .dark-theme .diff-line-added {
            background: #234431 !important;
        }
        
        .diff-glyph-removed::before {
            content: '−';
            color: #ffa198;
            font-weight: bold;
            font-size: 16px;
            margin-left: 4px;
        }
        
        .diff-glyph-added::before {
            content: '+';
            color: #aff5b4;
            font-weight: bold;
            font-size: 16px;
            margin-left: 4px;
        }
        
        /* Inline diff action buttons - positioned on right side */
        .diff-action-widget {
            z-index: 100;
            margin-left: 12px;
        }
        
        .diff-actions-inline {
            display: flex;
            gap: 2px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .diff-btn {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
            background: transparent;
        }
        
        .diff-btn-accept {
            color: #3fb950;
        }
        
        .diff-btn-accept:hover {
            background: rgba(63, 185, 80, 0.2);
        }
        
        .diff-btn-reject {
            color: #f85149;
        }
        
        .diff-btn-reject:hover {
            background: rgba(248, 81, 73, 0.2);
        }
        
        /* Light theme adjustments */
        body:not(.dark-theme) .diff-line-removed {
            background: #ffebe9 !important;
        }
        
        body:not(.dark-theme) .diff-line-added {
            background: #dafbe1 !important;
        }
        
        body:not(.dark-theme) .diff-actions-inline {
            background: #ffffff;
            border-color: #d0d7de;
        }
        
        /* DEBUG WINDOW - COMMENTED OUT (Not functional)
        .debug-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 500px;
            max-width: 90vw;
            max-height: 400px;
            background: var(--console-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }
        
        .debug-window.visible {
            display: flex;
        }
        
        .debug-window-header {
            padding: 12px 16px;
            background: var(--console-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }
        
        .debug-window-header h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--console-text);
        }
        
        .debug-window-controls {
            display: flex;
            gap: 6px;
        }
        
        .debug-window-content {
            flex: 1;
            overflow: auto;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            color: var(--console-text);
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .log-entry.info { color: #60a5fa; }
        .log-entry.success { color: #34d399; }
        .log-entry.warning { color: #fbbf24; }
        .log-entry.error { color: #f87171; }
        .log-entry.debug { color: #a78bfa; }
        */
        
        /* PREVIEW - Simple Tab Switch Only */
        #preview-iframe {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        /* STREAMING INDICATOR */
        .streaming-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-bg);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            margin-left: 8px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .btn-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text-secondary); cursor: pointer; }
        .btn-icon:hover { background-color: var(--bg-tertiary); color: var(--text-primary); }
        .action-btn { padding: 4px 12px; font-size: 11px; font-weight: 600; border-radius: 6px; }

        .tab-btn {
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        /* Diff batch actions styling */
        #diff-batch-actions {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="dark-theme" id="app">

    <div class="overlay" id="overlay"></div>

    <header class="app-header">
        <div class="flex items-center gap-3">
            <button class="mobile-toggle btn-icon" id="menuBtn">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <h1 class="font-bold text-sm tracking-tight whitespace-nowrap">
                AI Code <span class="opacity-50">Fix Pro</span>
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <span id="status-badge" class="status-badge success">Ready</span>
            <button id="detect-errors-btn" class="action-btn bg-blue-600 text-white">Detect Errors</button>
            <button id="fix-btn" class="action-btn bg-green-600 text-white" disabled>AI Fix</button>
            <button id="toggle-chat" class="action-btn bg-gray-600 text-white hidden lg:block">
                <span id="chat-toggle-text">Hide Chat</span>
            </button>
            <div class="flex bg-zinc-100 dark:bg-zinc-900 p-1 rounded-md border border-zinc-200 dark:border-zinc-800">
                <button id="editorTab" class="tab-btn active">Editor</button>
                <button id="previewTab" class="tab-btn">Preview</button>
            </div>
            <label class="text-xs flex items-center gap-2 opacity-70 cursor-pointer" title="Auto-accept AI fixes">
                <input type="checkbox" id="auto-accept-toggle">
                <span>Auto-accept</span>
            </label>
            <!-- DEBUG BUTTON COMMENTED OUT - Not functional
            <button class="btn-icon" id="debug-log-btn" title="Debug Log">
                <i data-lucide="bug" class="w-4 h-4"></i>
            </button>
            -->
            <button class="btn-icon" id="themeToggle">
                <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <div class="main-container">
        <main class="editor-section">
            <div class="editor-toolbar">
                <div class="flex items-center gap-2">
                    <button class="btn-icon" id="undo-btn" disabled title="Undo">
                        <i data-lucide="undo" class="w-4 h-4"></i>
                    </button>
                    <button class="btn-icon" id="redo-btn" disabled title="Redo">
                        <i data-lucide="redo" class="w-4 h-4"></i>
                    </button>
                    <span id="history-info" class="text-xs opacity-60 ml-2">No history</span>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Diff Batch Actions (hidden by default) -->
                    <div id="diff-batch-actions" style="display: none;" class="flex items-center gap-2 mr-2 pr-2 border-r border-zinc-700">
                        <span class="text-xs opacity-60" id="diff-count">0 changes</span>
                        <button class="action-btn bg-green-600 text-white" id="accept-all-btn" title="Accept all changes">
                            <i data-lucide="check-circle" class="w-3 h-3 inline mr-1"></i>
                            Accept All
                        </button>
                        <button class="action-btn bg-red-600 text-white" id="reject-all-btn" title="Reject all changes">
                            <i data-lucide="x-circle" class="w-3 h-3 inline mr-1"></i>
                            Reject All
                        </button>
                    </div>
                    
                    <label class="text-xs flex items-center gap-2 opacity-70 cursor-pointer">
                        <input type="checkbox" id="auto-fix-toggle" checked>
                        Auto-fix
                    </label>
                    <button class="btn-icon" id="copy-code-btn" title="Copy">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                    <button class="btn-icon" id="clear-code-btn" title="Clear">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Monaco Editor Container -->
            <div class="code-viewport" id="codeViewport">
                <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
            </div>

            <iframe id="preview-iframe"></iframe>

            <div id="consolePanel" class="console-panel">
                <div id="consoleHeader" class="console-header">
                    <div class="flex items-center gap-2">
                        <i id="consoleChevron" data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                        Problems
                    </div>
                    <button class="btn-icon h-6 w-6" id="clear-console-btn" title="Clear console">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="console-body" id="console-log">
                    <div style="opacity: 0.6; color: #9ca3af;">[✓] No problems found</div>
                </div>
            </div>
        </main>

        <aside class="ai-sidebar" id="chat-panel">
            <div class="p-4 border-b flex items-center justify-between" style="border-color: var(--border-color)">
                <h2 class="text-sm font-bold flex items-center gap-2">AI Assistant</h2>
                <div class="flex gap-2">
                    <button class="btn-icon h-7 w-7" id="clear-chat-btn" title="Clear chat">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="mobile-toggle btn-icon h-7 w-7" id="closeSidebarBtn">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <div class="chat-container" id="chat-messages">
                <div class="message message-bot">
                    Hello Muhamad. I'm your AI assistant. I can help you fix code errors, explain concepts, and improve your code quality. How can I help you today?
                </div>
            </div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea class="message-input" id="chatInput" placeholder="Ask AI to fix errors, explain code, or improve quality..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- DEBUG WINDOW COMMENTED OUT - Not functional
    <div id="debug-window" class="debug-window">
        <div class="debug-window-header">
            <h3>Debug Log</h3>
            <div class="debug-window-controls">
                <button id="copy-debug-btn" class="action-btn">Copy</button>
                <button id="clear-debug-btn" class="action-btn">Clear</button>
                <button id="close-debug-btn" class="action-btn">X</button>
            </div>
        </div>
        <div id="debug-log" class="debug-window-content"></div>
    </div>
    -->

    <!-- App Module - Real functionality -->
    <script type="module" src="js/app.js"></script>
    
    <!-- Initialize Lucide Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
