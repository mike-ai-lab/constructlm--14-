<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Setup API Key</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 50px auto;
  padding: 20px;
  background: #f5f5f5;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h1 {
  color: #333;
  margin-bottom: 20px;
}
.info {
  background: #e7f3ff;
  border-left: 4px solid #007bff;
  padding: 12px;
  margin: 20px 0;
  font-size: 14px;
}
input {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin: 10px 0;
  font-family: monospace;
}
button {
  background: #007bff;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  margin-right: 10px;
}
button:hover {
  background: #0056b3;
}
button.secondary {
  background: #6c757d;
}
button.secondary:hover {
  background: #545b62;
}
.success {
  background: #d4edda;
  border-left: 4px solid #28a745;
  padding: 12px;
  margin: 20px 0;
  color: #155724;
}
.error {
  background: #f8d7da;
  border-left: 4px solid #dc3545;
  padding: 12px;
  margin: 20px 0;
  color: #721c24;
}
</style>
</head>
<body>

<div class="container">
  <h1>🔑 Setup Groq API Key</h1>
  
  <div class="info">
    <strong>Note:</strong> This tool needs a Groq API key to function. 
    Get your free API key from <a href="https://console.groq.com" target="_blank">console.groq.com</a>
  </div>

  <label for="api-key"><strong>Enter your Groq API Key:</strong></label>
  <input type="password" id="api-key" placeholder="gsk_...">

  <div style="margin-top: 20px;">
    <button onclick="saveKey()">💾 Save Key</button>
    <button onclick="testKey()" class="secondary">🧪 Test Key</button>
    <button onclick="clearKey()" class="secondary">🗑️ Clear Key</button>
  </div>

  <div id="message"></div>

  <div class="info" style="margin-top: 30px;">
    <strong>Alternative:</strong> The main ConstructLM app automatically syncs the API key from <code>.env.local</code>. 
    If you've already set <code>VITE_GROQ_API_KEY</code> there, just run the main app once.
  </div>
</div>

<script>
function saveKey() {
  const key = document.getElementById('api-key').value.trim();
  if (!key) {
    showMessage('Please enter an API key', 'error');
    return;
  }
  
  if (!key.startsWith('gsk_')) {
    showMessage('Invalid key format. Groq keys start with "gsk_"', 'error');
    return;
  }
  
  localStorage.setItem('groq_api_key', key);
  showMessage('✓ API key saved successfully! You can now use the AI Code Fix tool.', 'success');
}

async function testKey() {
  const key = document.getElementById('api-key').value.trim() || localStorage.getItem('groq_api_key');
  if (!key) {
    showMessage('No API key to test', 'error');
    return;
  }
  
  showMessage('Testing API key...', 'info');
  
  try {
    const response = await fetch('https://api.groq.com/openai/v1/models', {
      headers: {
        'Authorization': `Bearer ${key}`
      }
    });
    
    if (response.ok) {
      showMessage('✓ API key is valid and working!', 'success');
    } else {
      showMessage('✗ API key is invalid or expired', 'error');
    }
  } catch (error) {
    showMessage('✗ Connection error: ' + error.message, 'error');
  }
}

function clearKey() {
  if (confirm('Clear saved API key?')) {
    localStorage.removeItem('groq_api_key');
    document.getElementById('api-key').value = '';
    showMessage('API key cleared', 'success');
  }
}

function showMessage(text, type) {
  const msgDiv = document.getElementById('message');
  msgDiv.className = type;
  msgDiv.textContent = text;
}

// Load existing key on page load
window.onload = () => {
  const existingKey = localStorage.getItem('groq_api_key');
  if (existingKey) {
    document.getElementById('api-key').value = existingKey;
    showMessage('Existing API key loaded', 'success');
  }
};
</script>

</body>
</html>
